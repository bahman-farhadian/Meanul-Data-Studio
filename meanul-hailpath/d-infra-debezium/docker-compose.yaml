# d-infra-debezium — change data capture from PostgreSQL into Kafka.
#
# Debezium reads PostgreSQL's write-ahead log (the WAL, the journal the
# database writes before it changes anything) and turns every insert, update
# and delete into a Kafka message on a cdc.<table> topic. Nothing polls the
# database, and nothing has to be added to the application code.
#
# i-service-cache-updater consumes those topics and applies the changes to
# Redis. That is the loop that keeps the cache honest.
#
# ORDER MATTERS: bring this service up here, but register the connector only
# AFTER h-bootstrap has created the tables. The connector names the tables it
# follows, so registering it against an empty database would fail.
#
# Standalone test:
#   docker network create hailpath-net
#   cp .env.example .env                  (+ edit the password)
#   docker compose up -d
#   docker compose run --rm connector-register   (once the tables exist)
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: d-infra-debezium

services:
  hailpath-debezium:
    # Official Connect. Confluent's Avro converter is a set of jars
    # `make avro-converter-prepare` downloads once and this mount adds.
    image: ${CONNECT_IMAGE:-quay.io/debezium/connect:3.6.2.Final}
    container_name: hailpath-debezium
    hostname: hailpath-debezium
    restart: unless-stopped
    cpus: ${DEBEZIUM_CPUS:-0.4}
    mem_limit: ${DEBEZIUM_MEM:-2g}
    memswap_limit: ${DEBEZIUM_MEM:-2g}
    environment:
      TZ: ${TZ:-UTC}
      BOOTSTRAP_SERVERS: hailpath-kafka:9092
      GROUP_ID: hailpath-connect
      # Connect keeps its own state in Kafka: which connectors exist, how far
      # each one has read, and whether they are running. The image
      # entrypoint copies CONNECT_* into the worker config and does not
      # alias these three. Left unset, Connect asks for three copies,
      # which the one broker cannot create.
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Same encoding as every other topic in the stack: binary Avro, with
      # the schema kept in the Schema Registry.
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://hailpath-schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://hailpath-schema-registry:8081
      KAFKA_HEAP_OPTS: -Xmx1g -Xms1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      # Connect scans every plugin in the image before it opens the REST port,
      # and this image carries the full Debezium connector set. Measured at
      # 196 seconds to first answer; the previous 45s start_period with 5
      # retries gave up at 105 and marked a perfectly healthy worker unhealthy.
      start_period: 240s
    volumes:
      - ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-connect-plugins/confluent-avro-converter:/kafka/connect/confluent-avro-converter:ro
    networks:
      - backbone

  # One-shot: hand the connector definition to Connect.
  #
  # It sends a PUT, which creates the connector the first time and updates it
  # on every later run, so re-running after a config change is the normal way
  # to apply it. The database password is injected here and never written
  # into the committed JSON.
  connector-register:
    image: ${PYTHON_IMAGE:-python:3.13.15-slim}
    profiles: ["init"]
    cpus: ${CONNECTOR_REGISTER_CPUS:-0.25}
    mem_limit: ${CONNECTOR_REGISTER_MEM:-256m}
    memswap_limit: ${CONNECTOR_REGISTER_MEM:-256m}
    entrypoint: ["python", "/register.py"]
    environment:
      TZ: ${TZ:-UTC}
      CONNECT_URL: http://hailpath-debezium:8083
      CONNECTOR_FILE: /hailpath-pg.json
      PG_HOST: ${CDC_PG_HOST:-hailpath-proxy}
      PG_PORT: ${CDC_PG_PORT:-5432}
      PG_DATABASE: ${CDC_PG_DATABASE:-hailpath}
      PG_USER: ${CDC_PG_USER:-postgres}
      PG_PASSWORD: ${CDC_PG_PASSWORD:?set it in d-infra-debezium/.env}
    volumes:
      - ./connectors/register.py:/register.py:ro
      - ./connectors/hailpath-pg.json:/hailpath-pg.json:ro
    networks:
      - backbone

# No volumes: Connect keeps everything it needs in Kafka topics, so the
# container itself holds nothing worth saving.

networks:
  backbone:
    external: true
    name: hailpath-net
