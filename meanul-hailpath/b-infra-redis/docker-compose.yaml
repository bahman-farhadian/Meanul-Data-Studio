# b-infra-redis — one Redis. Clients use hailpath-redis.
# HAProxy publishes that one address on the host ports.
#
# Standalone test:
#   docker network create hailpath-net   (once, shared by the whole stack)
#   cp .env.example .env                 (edit REDIS_PASSWORD)
#   docker compose up -d
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: b-infra-redis

x-redis-node: &redis-node
  image: ${REDIS_IMAGE:-redis:8.10.1}
  restart: unless-stopped
  # The official image drops to this user only through its own entrypoint,
  # which we replace — so ask for it explicitly. A fresh named volume inherits
  # /data's redis:redis ownership from the image, so the data dir is writable.
  user: redis
  cpus: ${REDIS_CPUS:-0.5}
  mem_limit: ${REDIS_MEM:-4g}
  memswap_limit: ${REDIS_MEM:-4g}
  entrypoint: ["/bin/sh", "/entrypoint.sh"]
  healthcheck:
    # redis-cli picks the password up from REDISCLI_AUTH; grep makes the exit
    # status depend on the actual reply rather than on redis-cli's own code.
    test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
  networks:
    - backbone

x-redis-env: &redis-env
  TZ: ${TZ:-UTC}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in b-infra-redis/.env}
  REDISCLI_AUTH: ${REDIS_PASSWORD:?set it in b-infra-redis/.env}
  REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-2560mb}

# Anchored per item: YAML merge keys work on mappings only, so a shared
# volume LIST cannot be spliced into a service — each mount is its own anchor.
x-redis-entrypoint: &redis-entrypoint ./redis/entrypoint.sh:/entrypoint.sh:ro
x-redis-template: &redis-template ./redis/redis.conf:/templates/redis.conf:ro

services:
  hailpath-redis:
    <<: *redis-node
    container_name: hailpath-redis
    hostname: hailpath-redis
    environment:
      <<: *redis-env
      REDIS_NODE: hailpath-redis
    volumes:
      - *redis-entrypoint
      - *redis-template
      - hailpath-redis-data:/data

volumes:
  hailpath-redis-data:
    name: hailpath-redis-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-redis-data

networks:
  backbone:
    external: true
    name: hailpath-net
