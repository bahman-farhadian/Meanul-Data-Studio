# i-service-cache-updater — keeps Redis in step with PostgreSQL.
#
# Debezium turns every change in the database into a message on a cdc.* topic
# (piece d); this service applies those messages to Redis. That is what makes
# the cache trustworthy enough for every other service to read from it
# instead of the OLTP database.
#
# It has no port and no healthcheck: there is nothing to answer on. Its
# health is visible as consumer lag - see the README.
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: i-service-cache-updater

services:
  hailpath-cache-updater:
    build:
      # Builds install packages, which needs egress from the build container.
      # Defaults to the host's own network: a tunnel between here and this
      # host usually cannot see a build's forwarded container traffic, even
      # while the host's own connections work fine. Set BUILD_NETWORK=default
      # if this host has no such gap.
      network: ${BUILD_NETWORK:-host}
      # The parent directory: the image needs z-lib/ and the Avro schemas.
      context: ..
      dockerfile: i-service-cache-updater/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.18-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.9}
    image: hailpath/cache-updater:${HAILPATH_VERSION:-0.1.0}
    container_name: hailpath-cache-updater
    restart: unless-stopped
    cpus: ${CACHE_UPDATER_CPUS:-1.5}
    mem_limit: ${CACHE_UPDATER_MEM:-1536m}
    memswap_limit: ${CACHE_UPDATER_MEM:-1536m}
    depends_on:
      hailpath-kafka:
        condition: service_healthy
      hailpath-schema-registry:
        condition: service_healthy
      hailpath-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-hailpath-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-kafka}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?set it in .env}
      KAFKA_SSL_CA: ${KAFKA_SSL_CA:-/etc/kafka/secrets/ca.crt}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://hailpath-schema-registry:8081}
      KAFKA_GROUP_ID: ${CACHE_UPDATER_GROUP_ID:-hailpath-cache-updater}
      # A pattern, so a table added to CDC later needs no change here.
      CDC_TOPIC_PATTERN: ${CDC_TOPIC_PATTERN:-^cdc\..*}

      REDIS_HOST: ${REDIS_HOST:-hailpath-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match b-infra-redis/.env}

      # How often the collected changes are written and the position saved.
      CACHE_BATCH_SIZE: ${CACHE_BATCH_SIZE:-500}
      CACHE_FLUSH_SECONDS: ${CACHE_FLUSH_SECONDS:-2.0}
    volumes:
      - hailpath-kafka-secrets:/etc/kafka/secrets:ro
    networks:
      - backbone

volumes:
  hailpath-kafka-secrets:
    name: hailpath-kafka-secrets
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-kafka-secrets

networks:
  backbone:
    external: true
    name: hailpath-net
