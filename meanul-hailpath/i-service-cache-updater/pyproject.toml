[project]
name = "hailpath-cache-updater"
version = "0.1.0"
description = "Applies PostgreSQL changes to Redis"
requires-python = ">=3.13"

dependencies = [
    # Clients, logging and lifecycle helpers shared by every Python
    # component. See ../z-lib/hailpath-common.
    "hailpath-common",
]

[tool.uv.sources]
# A path, not a version: the shared package lives in this repository, and the
# image keeps the same layout so this resolves in both places.
hailpath-common = { path = "../z-lib/hailpath-common" }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cache_updater"]
