# A throwaway one-shot, entirely separate from ride-hailing's own
# compose project - `make zone-demand-prepare` brings this up on its own
# (part of `make prepare`) and it exits when done. No database, no
# network of its own to tear down - just one container that reads the
# trip-record parquet `make tlc-trips-fetch` already downloaded to the
# shared volume, and writes two CSV files back to it.
#
# Talks to no other container and reaches nowhere outside this host: the
# one thing here that used to need real internet access (streaming the
# parquet straight from CloudFront) moved to a host-side fetch step
# instead, the same as lion-fetch/tlc-zones-fetch - see tlc-trips-fetch
# in h-bootstrap/Makefile for why (repeated network egress on every
# retry, real cost on a metered host).

name: hailpath-zone-demand-prepare

services:
  zone-demand-prepare:
    build:
      network: ${BUILD_NETWORK:-host}
      context: ../..
      dockerfile: h-bootstrap/zone-demand-prepare/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.18-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.9}
    # Reads a month of trip records and aggregates them in fixed-size
    # batches, keeping only running totals, so this ceiling does not have to
    # scale with the month: the bound is the zone grid and one batch, not the
    # trip count. 823 MiB measured on 20.4M trips.
    #
    # It is still a ceiling and still needed. The first version collected
    # every row group and pd.concat'd them, holding two copies of 20.4M
    # trips plus a filtered third, and was OOM-killed here at exit 137. That
    # kill landed inside this cgroup and the host never noticed - its
    # MemAvailable never moved below 17.2 GiB. Uncapped on a machine without
    # swap it would have reached the host's own OOM-killer, which picks a
    # victim anywhere on the machine.
    cpus: ${ZONE_DEMAND_CPUS:-4}
    mem_limit: ${ZONE_DEMAND_MEM:-1280m}
    memswap_limit: ${ZONE_DEMAND_MEM:-1280m}
    environment:
      TLC_TRIP_DATA_MONTH: ${TLC_TRIP_DATA_MONTH:-2025-01}
      OUTPUT_DIR: /data
      ZONE_DEMAND_BATCH_ROWS: ${ZONE_DEMAND_BATCH_ROWS:-250000}
      # glibc keeps a per-thread arena and does not reliably return large
      # freed blocks to the OS, so the high-water this cgroup sees is the sum
      # of what every arena ever held rather than what is live. pyarrow reads
      # on several threads, so there are several arenas. Capping them at two
      # was worth more here than any change to the aggregation itself.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${HAILPATH_LION_DATA_DIR:?set it}:/data
