# h-bootstrap — prepares the stack, once, and exits.
#
# This is the last container to start and the only one that is supposed to
# stop. It applies the database schema, imports the New York street map,
# creates the drivers, passengers and zones, invents a week of history, loads
# that week into ClickHouse, and finally sets a marker in Redis.
#
# That marker is what releases the six services: while it is missing they
# wait. So if bootstrap fails halfway, nothing starts generating trips for
# drivers that do not exist - the stack stays quiet and the logs say why.
#
# Every step is safe to run again: existing rows are kept, an imported map is
# not imported twice, and the warehouse is not loaded twice.
#
# Standalone test:
#   cp .env.example .env    (+ match the passwords to pieces a, b and e)
#   make bootstrap          # schema, graph-restore, then seed. Do not
#                           # `compose up hailpath-bootstrap` on its own.
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: h-bootstrap

services:
  hailpath-bootstrap:
    build:
      # Builds install packages, which needs egress from the build container.
      # Defaults to the host's own network: a tunnel between here and this
      # host usually cannot see a build's forwarded container traffic, even
      # while the host's own connections work fine. Set BUILD_NETWORK=default
      # if this host has no such gap.
      network: ${BUILD_NETWORK:-host}
      # The context is the parent directory, because the image needs the
      # shared package in z-lib/ as well as this component.
      context: ..
      dockerfile: h-bootstrap/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.15-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.9}
    image: hailpath/bootstrap:${HAILPATH_VERSION:-0.1.0}
    container_name: hailpath-bootstrap
    # init profile: `docker compose up -d` must not start this without
    # graph-restore. `make bootstrap` is the path; it runs schema, then
    # graph-restore, then this service.
    profiles: ["init"]
    # A one-shot must not come back after it finishes. Anything else would
    # mean re-running the whole preparation on every container restart.
    restart: "no"
    cpus: ${BOOTSTRAP_CPUS:-20}
    # The routable graph is now a pg_restore of an already-built dump, not a
    # from-scratch topology build (h-bootstrap/lion-prepare/ does that part,
    # outside this container, once). Kept generous anyway - too small a
    # limit does not slow a step down, the kernel kills it outright.
    mem_limit: ${BOOTSTRAP_MEM:-24g}
    memswap_limit: ${BOOTSTRAP_MEM:-24g}
    # Nothing may be prepared before the things being prepared are up.
    depends_on:
      hailpath-postgres:
        condition: service_healthy
      hailpath-redis:
        condition: service_healthy
      hailpath-kafka:
        condition: service_healthy
      hailpath-schema-registry:
        condition: service_healthy
      hailpath-clickhouse:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      SIM_TIMEZONE: ${SIM_TIMEZONE:-America/New_York}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # PostgreSQL, through the entry tier - never a pg-* container by name.
      PG_HOST: ${PG_HOST:-hailpath-proxy}
      PG_WRITE_PORT: ${PG_WRITE_PORT:-5432}
      PG_READ_PORT: ${PG_READ_PORT:-5433}
      PG_DATABASE: ${PG_DATABASE:-hailpath}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?must match PG_SUPERUSER_PASSWORD in a-infra-postgres/.env}
      # Raised above the code's own default (5): the threaded routing pass
      # below checks out HISTORY_ROUTING_WORKERS connections at once.
      PG_POOL_SIZE: ${PG_POOL_SIZE:-24}

      # Redis.
      REDIS_HOST: ${REDIS_HOST:-hailpath-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match b-infra-redis/.env}

      # ClickHouse, through the entry tier.
      CH_HOST: ${CH_HOST:-hailpath-proxy}
      CH_HTTP_PORT: ${CH_HTTP_PORT:-8123}
      CH_DATABASE: ${CH_DATABASE:-hailpath}
      CH_USER: ${CH_USER:-hailpath}
      CH_PASSWORD: ${CH_PASSWORD:?must match e-infra-clickhouse/.env}

      # How much to create.
      SEED_DRIVERS: ${SEED_DRIVERS:-106000}
      SEED_PASSENGERS: ${SEED_PASSENGERS:-1500000}
      # Real OS processes generating driver/passenger records - pure CPU
      # work (Faker), so this matches BOOTSTRAP_CPUS above, not a thread
      # count.
      PEOPLE_GENERATION_WORKERS: ${PEOPLE_GENERATION_WORKERS:-20}
      HISTORY_DAYS: ${HISTORY_DAYS:-7}
      HISTORY_TRIPS_PER_DAY: ${HISTORY_TRIPS_PER_DAY:-655000}
      HISTORY_POSITIONS_PER_TRIP: ${HISTORY_POSITIONS_PER_TRIP:-8}
      # Real OS processes deciding trip specs before routing - pure CPU
      # work (zone-weight/OD-share lookups, distance decay), so this
      # matches BOOTSTRAP_CPUS too, same reasoning as
      # PEOPLE_GENERATION_WORKERS above.
      HISTORY_GENERATION_WORKERS: ${HISTORY_GENERATION_WORKERS:-20}
      HISTORY_ROUTING_WORKERS: ${HISTORY_ROUTING_WORKERS:-18}
      # Real, road-snapped points precomputed per zone before assigning
      # driver/passenger home locations and historical pickups/dropoffs -
      # see zones.build_road_point_pools's own docstring for why.
      ROAD_POINT_POOL_SIZE: ${ROAD_POINT_POOL_SIZE:-300}

      # How far a random point may sit from the nearest on-network road
      # vertex before nearest_road_point() rejects it and the caller retries.
      MAX_SNAP_KM: ${MAX_SNAP_KM:-0.5}

      # Prices, shared with dispatch-service so both quote the same way.
      FARE_BASE: ${FARE_BASE:-3.0}
      FARE_PER_KM: ${FARE_PER_KM:-1.75}
      FARE_PER_MINUTE: ${FARE_PER_MINUTE:-0.45}

      # The map. The routable graph itself is built by `make lion-prepare`
      # on the host, ahead of time - this only points at where the finished
      # dump is mounted.
      LION_DIR: /data/lion
      SKIP_MAP_IMPORT: ${SKIP_MAP_IMPORT:-false}
      FORCE_RESEED: ${FORCE_RESEED:-false}
    volumes:
      # The downloaded LION data and the graph built from it both live here,
      # so a rebuilt container does not redo either step.
      - hailpath-lion-data:/data/lion
    networks:
      - backbone

  # One-shot: restore the LION dump with the same pgRouting image as the
  # database. Bootstrap's Python image does not carry a PostgreSQL 18 client.
  graph-restore:
    image: ${PG_IMAGE:-pgrouting/pgrouting:18-3.6-3.8.0}
    profiles: ["init"]
    depends_on:
      hailpath-postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      # Direct to the database. A dump restore does not need the proxy.
      PGHOST: hailpath-postgres
      PGPORT: "5432"
      PGDATABASE: ${PG_DATABASE:-hailpath}
      PGUSER: ${PG_USER:-postgres}
      PGPASSWORD: ${PG_PASSWORD:?must match PG_SUPERUSER_PASSWORD in a-infra-postgres/.env}
      SKIP_MAP_IMPORT: ${SKIP_MAP_IMPORT:-false}
    volumes:
      - hailpath-lion-data:/data/lion:ro
      - ./graph-restore.sh:/graph-restore.sh:ro
    entrypoint: ["/bin/bash", "/graph-restore.sh"]
    networks:
      - backbone

volumes:
  hailpath-lion-data:
    name: hailpath-lion-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-lion-data

networks:
  backbone:
    external: true
    name: hailpath-net
