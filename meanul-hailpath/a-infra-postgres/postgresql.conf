# Mounted into the official pgRouting image. Flags that used to sit on
# the compose command line live here so the image is unmodified.

hba_file = '/etc/pg_hba.conf'
wal_level = logical
max_connections = 200
# A quarter of the 16g container ceiling. Street search used to hit the
# page cache and the cgroup OOM-killed the process at 128MB.
shared_buffers = 4GB
max_wal_senders = 10
max_replication_slots = 10
password_encryption = scram-sha-256
timezone = UTC
log_timezone = UTC
