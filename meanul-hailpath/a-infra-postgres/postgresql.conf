# Mounted into the official pgRouting image as config_file. That replaces
# the image's own postgresql.conf, so listen_addresses has to be here:
# the Docker default of '*' lives in the image file we are not using.

listen_addresses = '*'
port = 5432
hba_file = '/etc/pg_hba.conf'

wal_level = logical
max_connections = 200
max_wal_senders = 10
max_replication_slots = 10

# A quarter of the 16g container ceiling. Street search used to hit the
# page cache and the cgroup OOM-killed the process at 128MB.
shared_buffers = 4GB
# pgr_dijkstra runs on DRIVER_ROUTING_WORKERS threads at once. 64MB each
# stays inside the remaining RAM after shared_buffers.
work_mem = 64MB
maintenance_work_mem = 1GB
effective_cache_size = 10GB

password_encryption = scram-sha-256
timezone = UTC
log_timezone = UTC
