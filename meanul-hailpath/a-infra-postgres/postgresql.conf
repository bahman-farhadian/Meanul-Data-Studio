# Mounted into the official pgRouting image as config_file. That replaces
# the image's own postgresql.conf, so listen_addresses has to be here:
# the Docker default of '*' lives in the image file we are not using.

listen_addresses = '*'
port = 5432
hba_file = '/etc/pg_hba.conf'

wal_level = logical
max_wal_senders = 10
max_replication_slots = 10

# Everything that has to scale with the container ceiling is NOT here. It
# is passed as `-c` arguments in docker-compose.yaml, which override this
# file, so the sizes resolve from .env along with PG_MEM itself:
# shared_buffers, work_mem, maintenance_work_mem, effective_cache_size,
# max_connections and the parallel-worker counts.
#
# They used to be fixed here, written for a 16g container on a 125g host.
# A laptop profile that lowered PG_MEM to 3g got a server that could not
# start: 4GB of shared_buffers does not fit in a 3g cgroup. A ceiling and
# the settings sized against it have to move together or not at all, so
# they now live in one place.

password_encryption = scram-sha-256
timezone = UTC
log_timezone = UTC
