# a-infra-postgres — one PostgreSQL. Writes and reads are this process.
# HAProxy publishes it on the host ports so clients keep a stable address.
# Debezium tails this same database.

name: a-infra-postgres

services:
  hailpath-postgres:
    # Postgres 18, PostGIS 3.6, and pgRouting 3.8, published by the
    # pgRouting project. pg_hba.conf is mounted below, so this process
    # is that image and nothing is built here.
    image: ${PG_IMAGE:-pgrouting/pgrouting:18-3.6-3.8.0}
    container_name: hailpath-postgres
    hostname: hailpath-postgres
    restart: unless-stopped
    cpus: ${PG_CPUS:-10}
    mem_limit: ${PG_MEM:-16g}
    memswap_limit: ${PG_MEM:-16g}
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set it in a-infra-postgres/.env}
      POSTGRES_DB: ${PG_DATABASE:-hailpath}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - hailpath-pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/pg_hba.conf:ro
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # These override postgresql.conf, which is why they are here and not
    # there: every one of them has to be sized against PG_MEM above, and a
    # ceiling and the settings that fit inside it cannot live in two files.
    # The defaults are the 16g production sizes; the laptop profile lowers
    # PG_MEM and these together.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      - -c
      - work_mem=${PG_WORK_MEM:-64MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-10GB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-8}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-8}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${PG_DATABASE:-hailpath}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backbone

volumes:
  hailpath-pgdata:
    name: hailpath-pgdata
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-pgdata

networks:
  backbone:
    external: true
    name: hailpath-net
