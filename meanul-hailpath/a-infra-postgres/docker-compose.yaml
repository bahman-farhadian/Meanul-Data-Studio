# a-infra-postgres — one PostgreSQL. Writes and reads are this process.
# HAProxy publishes it on the host ports so clients keep a stable address.
# Debezium tails this same database.

name: a-infra-postgres

services:
  hailpath-postgres:
    # Postgres 18, PostGIS 3.6, and pgRouting 3.8, published by the
    # pgRouting project. pg_hba.conf is mounted below, so this process
    # is that image and nothing is built here.
    image: ${PG_IMAGE:-pgrouting/pgrouting:18-3.6-3.8.0}
    container_name: hailpath-postgres
    hostname: hailpath-postgres
    restart: unless-stopped
    cpus: ${PG_CPUS:-10}
    mem_limit: ${PG_MEM:-16g}
    memswap_limit: ${PG_MEM:-16g}
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set it in a-infra-postgres/.env}
      POSTGRES_DB: ${PG_DATABASE:-hailpath}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - hailpath-pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/pg_hba.conf:ro
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${PG_DATABASE:-hailpath}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backbone

volumes:
  hailpath-pgdata:
    name: hailpath-pgdata
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-pgdata

networks:
  backbone:
    external: true
    name: hailpath-net
