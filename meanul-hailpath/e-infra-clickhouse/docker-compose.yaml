# e-infra-clickhouse — one ClickHouse. Clients use hailpath-clickhouse:8123
# (HTTP) and :9000 (native). clickhouse-sink writes; Grafana reads.
#
# Standalone test:
#   docker network create hailpath-net
#   cp .env.example .env                 (+ edit the password)
#   docker compose up -d
#   docker compose run --rm ch-ddl-init
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: e-infra-clickhouse

services:
  hailpath-clickhouse:
    image: ${CH_SERVER_IMAGE:-clickhouse/clickhouse-server:26.8.38.9}
    container_name: hailpath-clickhouse
    hostname: hailpath-clickhouse
    restart: unless-stopped
    cpus: ${CH_CPUS:-1.3}
    mem_limit: ${CH_MEM:-8g}
    memswap_limit: ${CH_MEM:-8g}
    # ClickHouse opens many files at once; the default container limit is far
    # too low for a merge-heavy table engine.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      TZ: ${TZ:-UTC}
      # The image creates this login on first start, so no password is written
      # into any file in this repository.
      CLICKHOUSE_USER: ${CH_USER:-hailpath}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:?set it in e-infra-clickhouse/.env}
      CLICKHOUSE_DB: hailpath
      # Read by from_env in config.d/memory.xml and users.d/profiles.xml.
      # Bytes. Compose defaults are the 8g deploy sizes; the laptop .env
      # lowers CH_MEM and these together.
      CH_MAX_SERVER_MEMORY: ${CH_MAX_SERVER_MEMORY:-6979321856}
      CH_MARK_CACHE_SIZE: ${CH_MARK_CACHE_SIZE:-1073741824}
      CH_UNCOMPRESSED_CACHE_SIZE: ${CH_UNCOMPRESSED_CACHE_SIZE:-1073741824}
      CH_MAX_QUERY_MEMORY: ${CH_MAX_QUERY_MEMORY:-4294967296}
      CH_MAX_THREADS: ${CH_MAX_THREADS:-4}
    ports:
      - "${PROXY_CH_HTTP_PORT:-8123}:8123"
      - "${PROXY_CH_NATIVE_PORT:-9000}:9000"
    volumes:
      # Individual files, not the two directories. The image entrypoint writes
      # default-user.xml into users.d; a read-only directory mount stops it.
      - ./config/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./config/clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
      - ./config/clickhouse/users.d/grants.xml:/etc/clickhouse-server/users.d/grants.xml:ro
      - hailpath-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backbone

  # One-shot: create the tables. Run it after the server is healthy. Every
  # statement uses IF NOT EXISTS, so re-running is safe and is how a newly
  # added DDL file is rolled out.
  ch-ddl-init:
    image: ${CH_SERVER_IMAGE:-clickhouse/clickhouse-server:26.8.38.9}
    profiles: ["init"]
    cpus: ${CH_DDL_CPUS:-0.25}
    mem_limit: ${CH_DDL_MEM:-512m}
    memswap_limit: ${CH_DDL_MEM:-512m}
    entrypoint: ["/bin/sh", "/apply-ddl.sh"]
    environment:
      TZ: ${TZ:-UTC}
      CH_HOST: hailpath-clickhouse
      CH_USER: ${CH_USER:-hailpath}
      CH_PASSWORD: ${CH_PASSWORD:?set it in e-infra-clickhouse/.env}
    volumes:
      - ./ddl:/ddl:ro
      - ./ddl/apply-ddl.sh:/apply-ddl.sh:ro
    networks:
      - backbone

volumes:
  hailpath-clickhouse-data:
    name: hailpath-clickhouse-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HAILPATH_VOLUME_ROOT:?set it in meanul-hailpath/.env}/hailpath-clickhouse-data

networks:
  backbone:
    external: true
    name: hailpath-net
