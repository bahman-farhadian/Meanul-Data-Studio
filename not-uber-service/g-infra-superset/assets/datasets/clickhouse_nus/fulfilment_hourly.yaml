metrics:
  - metric_name: 'requests'
    verbose_name: 'Requests'
    metric_type: 'count'
    expression: 'sum(trips_ended)'
    description: 'Every request that reached an ending, served or not.'
    d3format: ',d'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'completed_trips'
    verbose_name: 'Completed'
    metric_type: 'count'
    expression: 'sum(completed)'
    description: null
    d3format: ',d'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'unmatched'
    verbose_name: 'No driver found'
    metric_type: 'count'
    expression: 'sum(no_driver_found)'
    description: 'Nobody could be offered the ride at all. A supply failure, not a cancellation.'
    d3format: ',d'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'rider_cancels'
    verbose_name: 'Cancelled by rider'
    metric_type: 'count'
    expression: 'sum(cancelled_by_passenger)'
    description: null
    d3format: ',d'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'driver_cancels'
    verbose_name: 'Cancelled by driver'
    metric_type: 'count'
    expression: 'sum(cancelled_by_driver)'
    description: null
    d3format: ',d'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'fulfilment_rate'
    verbose_name: 'Fulfilment rate'
    metric_type: 'avg'
    expression: 'sum(completed) / greatest(sum(trips_ended), 1)'
    description: 'Completed out of everything asked for. The one number that counts the requests nobody served.'
    d3format: ',.1%'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'cancellation_rate'
    verbose_name: 'Cancellation rate'
    metric_type: 'avg'
    expression: '(sum(cancelled_by_passenger) + sum(cancelled_by_driver)) / greatest(sum(trips_ended), 1)'
    description: 'Both sides together. A trip nobody could be found for is counted separately.'
    d3format: ',.1%'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'no_driver_rate'
    verbose_name: 'Unmatched rate'
    metric_type: 'avg'
    expression: 'sum(no_driver_found) / greatest(sum(trips_ended), 1)'
    description: null
    d3format: ',.1%'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'post_arrival_cancel_rate'
    verbose_name: 'Cancelled after the driver arrived'
    metric_type: 'avg'
    expression: 'sum(cancelled_after_arrival) / greatest(sum(cancelled_by_passenger) + sum(cancelled_by_driver), 1)'
    description: 'The line a real platform draws to charge a cancellation fee.'
    d3format: ',.1%'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'time_to_match_s'
    verbose_name: 'Time to match'
    metric_type: 'avg'
    expression: 'sum(match_s_sum) / greatest(sum(matched_trips), 1)'
    description: 'Request to a driver being picked, in seconds.'
    d3format: ',.0f'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'rider_wait_s'
    verbose_name: 'Rider wait at the kerb'
    metric_type: 'avg'
    expression: 'sum(wait_s_sum) / greatest(sum(waited_trips), 1)'
    description: 'Driver arriving to the rider getting in. What the ''arrived'' state exists to measure.'
    d3format: ',.0f'
    currency: null
    warning_text: null
    extra: null
