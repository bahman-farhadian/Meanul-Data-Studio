# The funnel that finally counts the trips that did NOT complete.
# Every other rollup in this warehouse filters status = 'completed',
# so cancellations and unmatched requests appeared in no aggregate at
# all until this table existed. Bucketed on when the ride was ASKED
# for, not when it ended - a fulfilment rate is about the demand that
# arrived in an hour.
# SummingMergeTree, filled per node: the same key exists on both shards as two partial rows. Every ratio below sums first and divides once.
