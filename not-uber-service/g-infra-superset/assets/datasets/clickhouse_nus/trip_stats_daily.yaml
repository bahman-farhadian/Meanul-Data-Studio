# Money, at day grain. revenue and payout_total are Decimal64(2) and
# summed exactly, because float addition is not associative and this
# column is summed inside background merges in an order nobody
# controls. Take rate below casts to float on the RATIO and never on
# the money.
# SummingMergeTree, filled per node: the same key exists on both shards as two partial rows. Every ratio below sums first and divides once.
