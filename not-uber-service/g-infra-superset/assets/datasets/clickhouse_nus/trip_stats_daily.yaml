  - metric_name: 'platform_fee'
    verbose_name: 'Platform fee'
    metric_type: 'sum'
    expression: 'sum(revenue) - sum(payout_total)'
    description: null
    d3format: '$,.0f'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'take_rate'
    verbose_name: 'Take rate'
    metric_type: 'avg'
    expression: 'toFloat64(sum(revenue) - sum(payout_total)) / greatest(toFloat64(sum(revenue)), 1)'
    description: 'What the platform keeps. Decimal divided by Decimal truncates to the left operand''s scale, so the cast is on the ratio.'
    d3format: ',.1%'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'avg_surge'
    verbose_name: 'Average surge'
    metric_type: 'avg'
    expression: 'sum(surge_sum) / greatest(sum(completed_trips), 1)'
    description: 'Surge added up and divided by trips - never an average of averages.'
    d3format: ',.2f'
    currency: null
    warning_text: null
    extra: null
  - metric_name: 'overrun_rate'
    verbose_name: 'Slower than predicted'
    metric_type: 'avg'
    expression: 'sum(overrun_trips) / greatest(sum(completed_trips), 1)'
