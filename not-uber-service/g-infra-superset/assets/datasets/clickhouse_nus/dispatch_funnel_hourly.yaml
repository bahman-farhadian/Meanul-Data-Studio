# The matching funnel. Dispatch offers a ride to one candidate at a
# time with a deadline, so acceptance rate, offers per match and
# time-to-match come from here and from nowhere else - none of them
# existed while dispatch simply assigned a driver.
# 'expired' and 'declined' are kept apart on purpose: a driver who
# said no is a different supply signal from a phone left face-down.
# SummingMergeTree, filled per node: the same key exists on both shards as two partial rows. Every ratio below sums first and divides once.
