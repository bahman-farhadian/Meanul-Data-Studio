# One row per driver per hour, counted from position reports rather
# than from trips - so a driver who was online and never matched is
# in the denominator, which is the only way this number means
# anything.
# SummingMergeTree, filled per node: the same key exists on both shards as two partial rows. Every ratio below sums first and divides once.
