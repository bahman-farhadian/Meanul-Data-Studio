# g-infra-superset — the analytical view.
#
# Superset is where questions are explored: write SQL, turn it into a chart,
# put charts on a dashboard. Grafana (piece f) is the live view. Both read
# the same ClickHouse cluster.
#
# Superset needs a small database of its own for users and saved dashboards.
# It uses SQLite on a named volume, which is why it runs with exactly ONE
# worker: SQLite allows one writer at a time. That is enough here - the stack
# is documented for a single dashboard user (main README, section 2.9).
#
# Standalone test:
#   docker network create nus-backbone
#   cp .env.example .env                    (+ edit the passwords)
#   docker compose up -d --build
#   docker compose run --rm superset-init
#
# In the full stack this file is include'd by the root docker-compose.yaml
# and reached through lb-a on port 8088. Full-stack runbook: ../README.md

name: g-infra-superset

x-superset-build: &superset-build
  context: .
  args:
    SUPERSET_IMAGE: ${SUPERSET_IMAGE:-apache/superset:6.1.0}
    CLICKHOUSE_CONNECT_VERSION: ${CLICKHOUSE_CONNECT_VERSION:-1.7.2}

x-superset-env: &superset-env
  TZ: ${TZ:-UTC}
  # Tells Superset to read our settings file instead of its defaults.
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set it in g-infra-superset/.env}
  SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set it in g-infra-superset/.env}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.invalid}
  # How Superset logs in to ClickHouse, through the entry tier.
  CH_HOST: ${CH_HOST:-lb-a}
  CH_HTTP_PORT: ${CH_HTTP_PORT:-8123}
  CH_DATABASE: ${CH_DATABASE:-nus}
  CH_USER: ${CH_USER:-nus}
  CH_PASSWORD: ${CH_PASSWORD:?set it in g-infra-superset/.env}

services:
  superset:
    build: *superset-build
    image: nus/superset:${NUS_VERSION:-0.1.0}
    container_name: superset
    hostname: superset
    restart: unless-stopped
    cpus: 0.6
    mem_limit: 3g
    memswap_limit: 3g
    environment: *superset-env
    # The web server is started explicitly rather than left to the image
    # default, so the worker count stays visible right here next to the
    # reason for it.
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8088
      - --workers
      - "1"
      - --worker-class
      - gthread
      - --threads
      - "4"
      - --timeout
      - "120"
      - "superset.app:create_app()"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backbone

  # One-shot: prepare Superset's own database, create the admin user, load
  # the roles, and register the ClickHouse connection. Run it after the
  # first `up`, and again whenever the ClickHouse password changes.
  superset-init:
    build: *superset-build
    image: nus/superset:${NUS_VERSION:-0.1.0}
    profiles: ["init"]
    cpus: 0.5
    mem_limit: 2g
    memswap_limit: 2g
    entrypoint: ["/bin/bash", "/init/init-superset.sh"]
    environment: *superset-env
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./init:/init:ro
      - superset-home:/app/superset_home
    networks:
      - backbone

volumes:
  # Superset's own database plus anything saved in the browser.
  superset-home:
    name: nus-superset-home
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-superset-home

networks:
  backbone:
    external: true
    name: nus-backbone
