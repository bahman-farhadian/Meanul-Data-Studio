# a-infra-postgres — one PostgreSQL. Writes and reads are this process.
# HAProxy publishes it on the host ports so clients keep a stable address.
# Debezium tails this same database.

name: a-infra-postgres

services:
  nus-postgres:
    # Postgres 18, PostGIS 3.6, and pgRouting 3.8, published by the
    # pgRouting project. pg_hba.conf is mounted below, so this process
    # is that image and nothing is built here.
    image: ${PG_IMAGE:-pgrouting/pgrouting:18-3.6-3.8.0}
    container_name: nus-postgres
    hostname: nus-postgres
    restart: unless-stopped
    cpus: ${PG_CPUS:-10}
    mem_limit: ${PG_MEM:-9g}
    memswap_limit: ${PG_MEM:-9g}
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set it in a-infra-postgres/.env}
      POSTGRES_DB: ${PG_DATABASE:-nus}
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - hba_file=/etc/pg_hba.conf
      # logical WAL is what Debezium's pgoutput slot reads
      - -c
      - wal_level=logical
      - -c
      - max_connections=200
      # A quarter of the 16g container ceiling. The 128MB default left
      # street search on the page cache and the cgroup OOM-killed the process.
      - -c
      - shared_buffers=4GB
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - password_encryption=scram-sha-256
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - pgdata-1:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${PG_DATABASE:-nus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backbone

volumes:
  pgdata-1:
    name: nus-pgdata-1
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-pgdata-1

networks:
  backbone:
    external: true
    name: nus-backbone
