# a-infra-postgres — Patroni-managed PostgreSQL cluster (3 identical nodes,
# leader elected) backed by the stack's shared 3-node TLS etcd cluster
# (nus-etcd — reused by any future component that needs etcd; never deploy
# a second one). Node naming starts at 1: etcd-1/2/3, pg-1/2/3.
#
# Standalone test:
#   docker network create nus-backbone   (once, shared by the whole stack)
#   cp .env.example .env                 (edit the passwords)
#   docker compose run --rm etcd-certgen (one-shot TLS bootstrap, removes itself)
#   docker compose up -d --build
#   ... then flip ETCD_INITIAL_CLUSTER_STATE to 'existing' in etcd.env.
#
# In the full stack this file is include'd by the root docker-compose.yaml;
# writes/reads enter through the lb-a/lb-b HAProxy pair (5432/5433).
# Full-stack runbook: ../README.md

name: a-infra-postgres

x-etcd-node: &etcd-node
  image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.6.12}
  restart: unless-stopped
  cpus: 0.15
  mem_limit: 384m
  memswap_limit: 384m
  env_file: etcd.env
  healthcheck:
    test:
      - CMD
      - etcdctl
      - --endpoints=https://localhost:2379
      - --cacert=/certs/ca.crt
      - --cert=/certs/client.crt
      - --key=/certs/client.key
      - endpoint
      - health
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
  networks:
    - backbone

x-pg-node: &pg-node
  build:
    context: .
    args:
      PG_IMAGE: ${PG_IMAGE:-postgres:18.4}
  image: nus/patroni-postgres:18.4
  restart: unless-stopped
  cpus: 1.6
  mem_limit: 9g
  memswap_limit: 9g
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  networks:
    - backbone

x-pg-env: &pg-env
  TZ: ${TZ:-UTC}
  PATRONI_SCOPE: ${PATRONI_SCOPE:-nus-pg}
  PATRONI_ETCD3_PROTOCOL: https
  PATRONI_ETCD3_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
  PATRONI_ETCD3_CACERT: /certs/ca.crt
  PATRONI_ETCD3_CERT: /certs/client.crt
  PATRONI_ETCD3_KEY: /certs/client.key
  PATRONI_RESTAPI_USERNAME: ${PATRONI_REST_USER:-patroni}
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_REST_PASSWORD:?set it in a-infra-postgres/.env}
  PATRONI_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set it in a-infra-postgres/.env}
  PATRONI_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:?set it in a-infra-postgres/.env}

services:
  # One-shot TLS bootstrap: generates the etcd CA + server/peer + client
  # certificates (10-year validity, SANs for etcd-1/2/3) into the
  # etcd-certs volume. Lives behind the "init" profile so `up` never
  # starts it — run it explicitly and it removes itself on exit:
  #   docker compose run --rm etcd-certgen
  etcd-certgen:
    image: ${OPENSSL_IMAGE:-alpine/openssl:3.5.6}
    profiles: ["init"]
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    volumes:
      - ./certs/gen-certs.sh:/gen-certs.sh:ro
      - etcd-certs:/certs
    networks:
      - backbone

  etcd-1:
    <<: *etcd-node
    container_name: etcd-1
    hostname: etcd-1
    environment:
      TZ: ${TZ:-UTC}
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: https://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://etcd-1:2380
    volumes:
      - etcd-data-1:/etcd-data
      - etcd-certs:/certs:ro

  etcd-2:
    <<: *etcd-node
    container_name: etcd-2
    hostname: etcd-2
    environment:
      TZ: ${TZ:-UTC}
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: https://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://etcd-2:2380
    volumes:
      - etcd-data-2:/etcd-data
      - etcd-certs:/certs:ro

  etcd-3:
    <<: *etcd-node
    container_name: etcd-3
    hostname: etcd-3
    environment:
      TZ: ${TZ:-UTC}
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: https://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://etcd-3:2380
    volumes:
      - etcd-data-3:/etcd-data
      - etcd-certs:/certs:ro

  pg-1:
    <<: *pg-node
    container_name: pg-1
    hostname: pg-1
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
    volumes:
      - pgdata-1:/var/lib/postgresql
      - etcd-certs:/certs:ro

  pg-2:
    <<: *pg-node
    container_name: pg-2
    hostname: pg-2
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
    volumes:
      - pgdata-2:/var/lib/postgresql
      - etcd-certs:/certs:ro

  pg-3:
    <<: *pg-node
    container_name: pg-3
    hostname: pg-3
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-3:5432
    volumes:
      - pgdata-3:/var/lib/postgresql
      - etcd-certs:/certs:ro

# Fixed volume names (no project prefix): the same volumes are used whether
# this file runs standalone (project a-infra-postgres) or include'd by the
# root compose (project not-uber-service) — otherwise the certs generated
# by a standalone `run --rm etcd-certgen` would land in a different volume
# than the one the full stack mounts.
volumes:
  etcd-certs:
    name: nus-etcd-certs
  etcd-data-1:
    name: nus-etcd-data-1
  etcd-data-2:
    name: nus-etcd-data-2
  etcd-data-3:
    name: nus-etcd-data-3
  pgdata-1:
    name: nus-pgdata-1
  pgdata-2:
    name: nus-pgdata-2
  pgdata-3:
    name: nus-pgdata-3

networks:
  backbone:
    external: true
    name: nus-backbone
