# Resource limits — laptop profile (24 GB MacBook Air M5, 20 GB Docker VM;
# budget in the main README, section 2.9).
#
# Apply on top of the root file:
#   docker compose -f docker-compose.yaml -f compose.laptop.yaml up -d
#
# memswap_limit equals mem_limit on every service: memory+swap = memory,
# i.e. zero swap per container (the no-swap policy). An undersized
# container gets OOM-killed and restarted visibly instead of swapping.
#
# All three pg nodes carry identical limits: Patroni elects the leader, so
# any node can be the primary at any moment. Entries for the remaining
# components are added here as each piece lands.

services:
  lb-a:
    cpus: 0.05
    mem_limit: 64m
    memswap_limit: 64m

  lb-b:
    cpus: 0.05
    mem_limit: 64m
    memswap_limit: 64m

  etcd-1:
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m

  etcd-2:
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m

  etcd-3:
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m

  etcd-certgen:
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m

  pg-1:
    cpus: 0.65
    mem_limit: 1280m
    memswap_limit: 1280m

  pg-2:
    cpus: 0.65
    mem_limit: 1280m
    memswap_limit: 1280m

  pg-3:
    cpus: 0.65
    mem_limit: 1280m
    memswap_limit: 1280m
