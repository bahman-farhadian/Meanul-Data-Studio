# j-service-driver — the simulated drivers.
#
# ONE container manages MANY drivers. A container per driver would be a
# thousand containers to schedule and no closer to the truth; a driver is a
# position, a status and a destination, and a process can hold thousands of
# those.
#
# It sends a position report per online driver every few seconds, and keeps
# the list of free drivers in Redis so dispatch can find the nearest one.
# The database is written far less often: the stream of positions belongs in
# Kafka, and PostgreSQL only keeps the last known state.
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: j-service-driver

services:
  driver-service:
    build:
      context: ..
      dockerfile: j-service-driver/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.15-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.9}
    image: nus/driver-service:${NUS_VERSION:-0.1.0}
    container_name: driver-service
    restart: unless-stopped
    cpus: 0.15
    mem_limit: 768m
    memswap_limit: 768m
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      pg-1:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_GROUP_ID: ${DRIVER_GROUP_ID:-driver-service}

      REDIS_SENTINELS: ${REDIS_SENTINELS:-sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-nus-cache}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match b-infra-redis/.env}

      PG_HOST: ${PG_HOST:-lb-a}
      PG_WRITE_PORT: ${PG_WRITE_PORT:-5432}
      PG_READ_PORT: ${PG_READ_PORT:-5433}
      PG_DATABASE: ${PG_DATABASE:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?must match a-infra-postgres/.env}

      # The same city every component draws.
      CITY_MIN_LAT: ${CITY_MIN_LAT:-40.49}
      CITY_MAX_LAT: ${CITY_MAX_LAT:-40.92}
      CITY_MIN_LON: ${CITY_MIN_LON:--74.26}
      CITY_MAX_LON: ${CITY_MAX_LON:--73.70}
      CITY_GRID_ROWS: ${CITY_GRID_ROWS:-6}
      CITY_GRID_COLS: ${CITY_GRID_COLS:-6}

      # How the fleet behaves. These are the main volume dial of the stack:
      # a shorter tick or a larger online share means more messages a second.
      DRIVER_TICK_SECONDS: ${DRIVER_TICK_SECONDS:-3.0}
      DRIVER_SPEED_KMH: ${DRIVER_SPEED_KMH:-25.0}
      DRIVER_ONLINE_SHARE: ${DRIVER_ONLINE_SHARE:-0.6}
      DRIVER_SHIFT_CHANGE_CHANCE: ${DRIVER_SHIFT_CHANGE_CHANCE:-0.01}
      DRIVER_DB_SYNC_SECONDS: ${DRIVER_DB_SYNC_SECONDS:-30.0}
      DRIVER_HOTSPOT_REFRESH_SECONDS: ${DRIVER_HOTSPOT_REFRESH_SECONDS:-60.0}
      RANDOM_SEED: ${RANDOM_SEED:-20250824}
    networks:
      - backbone

networks:
  backbone:
    external: true
    name: nus-backbone
