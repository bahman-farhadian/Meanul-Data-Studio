# e-infra-clickhouse — the analytics database.
#
# One ClickHouse. A second copy on this host is not a second machine,
# so there is no shard, no replica, and no Keeper.
#
# Clients (clickhouse-sink, Grafana, Superset) come in through the lb-a/lb-b
# HAProxy pair on 8123 (HTTP) and 9000 (native).
#
# Standalone test:
#   docker network create nus-backbone
#   cp .env.example .env                 (+ edit the password)
#   docker compose up -d
#   docker compose run --rm ch-ddl-init
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: e-infra-clickhouse

x-ch-node: &ch-node
  image: ${CH_SERVER_IMAGE:-clickhouse/clickhouse-server:25.3}
  restart: unless-stopped
  cpus: ${CH_CPUS:-1.3}
  mem_limit: ${CH_MEM:-8g}
  memswap_limit: ${CH_MEM:-8g}
  # ClickHouse opens many files at once; the default container limit is far
  # too low for a merge-heavy table engine.
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  healthcheck:
    test:
      - CMD-SHELL
      - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null || exit 1
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 40s
  networks:
    - backbone

x-ch-env: &ch-env
  TZ: ${TZ:-UTC}
  # The image creates this login on first start, so no password is written
  # into any file in this repository.
  CLICKHOUSE_USER: ${CH_USER:-nus}
  CLICKHOUSE_PASSWORD: ${CH_PASSWORD:?set it in e-infra-clickhouse/.env}

# Individual files, not the two directories. The image's entrypoint writes
# its own default-user.xml into users.d to create CLICKHOUSE_USER, and it
# writes into config.d as well — so mounting either directory read-only
# stops the node before it starts ("Read-only file system"), and mounting
# them writable would let a container write into the repository. Mounting
# the files leaves both directories writable and ours read-only.
x-ch-config-memory: &ch-config-memory ./config/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
x-ch-users: &ch-users ./config/clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro

services:
  # The only server. The name is the one clients and make targets already use.
  ch-s1r1:
    <<: *ch-node
    container_name: nus-ch-s1r1
    hostname: nus-ch-s1r1
    environment:
      <<: *ch-env
      CH_HOSTNAME: nus-ch-s1r1
    volumes:
      - *ch-config-memory
      - *ch-users
      - ch-data-s1r1:/var/lib/clickhouse

  # One-shot: create the tables. Run it after the server is healthy. Every
  # statement uses IF NOT EXISTS, so re-running is safe and is how a newly
  # added DDL file is rolled out.
  ch-ddl-init:
    image: ${CH_SERVER_IMAGE:-clickhouse/clickhouse-server:25.3}
    profiles: ["init"]
    cpus: ${CH_DDL_CPUS:-0.25}
    mem_limit: ${CH_DDL_MEM:-512m}
    memswap_limit: ${CH_DDL_MEM:-512m}
    entrypoint: ["/bin/sh", "/apply-ddl.sh"]
    environment:
      TZ: ${TZ:-UTC}
      CH_HOST: nus-ch-s1r1
      CH_USER: ${CH_USER:-nus}
      CH_PASSWORD: ${CH_PASSWORD:?set it in e-infra-clickhouse/.env}
    volumes:
      - ./ddl:/ddl:ro
      - ./ddl/apply-ddl.sh:/apply-ddl.sh:ro
    networks:
      - backbone

volumes:
  ch-data-s1r1:
    name: nus-ch-data-s1r1
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-ch-data-s1r1

networks:
  backbone:
    external: true
    name: nus-backbone
