# i-service-cache-updater — keeps Redis in step with PostgreSQL.
#
# Debezium turns every change in the database into a message on a cdc.* topic
# (piece d); this service applies those messages to Redis. That is what makes
# the cache trustworthy enough for every other service to read from it
# instead of the OLTP database.
#
# It has no port and no healthcheck: there is nothing to answer on. Its
# health is visible as consumer lag - see the README.
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: i-service-cache-updater

services:
  cache-updater:
    build:
      # The parent directory: the image needs z-lib/ and the Avro schemas.
      context: ..
      dockerfile: i-service-cache-updater/Dockerfile
    image: nus/cache-updater:0.1.0
    container_name: cache-updater
    restart: unless-stopped
    cpus: 0.15
    mem_limit: 768m
    memswap_limit: 768m
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-cache-updater}
      # A pattern, so a table added to CDC later needs no change here.
      CDC_TOPIC_PATTERN: ${CDC_TOPIC_PATTERN:-^cdc\..*}

      REDIS_SENTINELS: ${REDIS_SENTINELS:-sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-nus-cache}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match b-infra-redis/.env}

      # How often the collected changes are written and the position saved.
      CACHE_BATCH_SIZE: ${CACHE_BATCH_SIZE:-500}
      CACHE_FLUSH_SECONDS: ${CACHE_FLUSH_SECONDS:-2.0}
    networks:
      - backbone

networks:
  backbone:
    external: true
    name: nus-backbone
