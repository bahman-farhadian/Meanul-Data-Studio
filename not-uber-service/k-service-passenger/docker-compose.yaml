# k-service-passenger — the simulated riders.
#
# It creates ride requests at a rate that follows the time of day, and sends
# a position report for every rider who is currently in a car.
#
# A request is written to PostgreSQL and sent to Kafka. The row is the record
# that the request exists; the message is how dispatch-service hears about
# it. One is state, the other is news, and the stack needs both.
#
# Deliberately not a mirror image of driver-service: a phone in a pocket and
# a device on a windscreen report at different rates and with different
# accuracy, so the two streams are produced by two independent services that
# happen to talk about the same trips.
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: k-service-passenger

services:
  passenger-service:
    build:
      # Builds install packages, which needs egress from the build container.
      # Defaults to the host's own network: a tunnel between here and this
      # host usually cannot see a build's forwarded container traffic, even
      # while the host's own connections work fine. Set BUILD_NETWORK=default
      # if this host has no such gap.
      network: ${BUILD_NETWORK:-host}
      context: ..
      dockerfile: k-service-passenger/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.15-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.9}
    image: nus/passenger-service:${NUS_VERSION:-0.1.0}
    container_name: passenger-service
    restart: unless-stopped
    cpus: ${PASSENGER_SERVICE_CPUS:-1.5}
    mem_limit: ${PASSENGER_SERVICE_MEM:-1536m}
    memswap_limit: ${PASSENGER_SERVICE_MEM:-1536m}
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      pg-1:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_GROUP_ID: ${PASSENGER_GROUP_ID:-passenger-service}

      REDIS_SENTINELS: ${REDIS_SENTINELS:-sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-nus-cache}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match b-infra-redis/.env}

      PG_HOST: ${PG_HOST:-lb-a}
      PG_WRITE_PORT: ${PG_WRITE_PORT:-5432}
      PG_READ_PORT: ${PG_READ_PORT:-5433}
      PG_DATABASE: ${PG_DATABASE:-nus}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?must match a-infra-postgres/.env}

      # How far a random point may sit from the nearest on-network road
      # vertex before nearest_road_point() rejects it and the caller retries.
      MAX_SNAP_KM: ${MAX_SNAP_KM:-0.5}

      # A pool of real, road-snapped points per zone, built once at startup
      # (nus_common.routing.build_road_point_pools) instead of paying a real
      # database round trip twice per new trip request, forever.
      ROAD_POINT_POOL_SIZE: ${ROAD_POINT_POOL_SIZE:-300}
      ROAD_POINT_POOL_WORKERS: ${ROAD_POINT_POOL_WORKERS:-8}

      # How much demand there is. This is the second volume dial of the
      # stack, after driver-service's tick: every request becomes a routing
      # calculation in dispatch, which is the most expensive step anywhere.
      PASSENGER_TICK_SECONDS: ${PASSENGER_TICK_SECONDS:-5.0}
      TRIP_REQUESTS_PER_MINUTE: ${TRIP_REQUESTS_PER_MINUTE:-40.0}
      RANDOM_SEED: ${RANDOM_SEED:-20250824}
    networks:
      - backbone

networks:
  backbone:
    external: true
    name: nus-backbone
