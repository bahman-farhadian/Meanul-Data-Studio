# l-service-dispatch — matching, routing and pricing.
#
# It takes ride requests, finds the nearest free driver in Redis, asks
# pgRouting for a real path over the New York street network, works out the
# price, and then sees the trip through to its end.
#
# This is the only service that decides a trip has changed status. One owner
# means one place to look when a trip is stuck, and no chance of two
# services disagreeing about what state a trip is in.
#
# It is also the slowest step in the pipeline: one routing query per trip,
# roughly 50 to 150 milliseconds. If anything falls behind under load, it
# will be this - and the answer is fewer requests, not more containers.
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: l-service-dispatch

services:
  dispatch-service:
    build:
      context: ..
      dockerfile: l-service-dispatch/Dockerfile
    image: nus/dispatch-service:0.1.0
    container_name: dispatch-service
    restart: unless-stopped
    cpus: 0.15
    mem_limit: 768m
    memswap_limit: 768m
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      pg-1:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-dispatch-service}

      REDIS_SENTINELS: ${REDIS_SENTINELS:-sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-nus-cache}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match b-infra-redis/.env}

      PG_HOST: ${PG_HOST:-lb-a}
      PG_WRITE_PORT: ${PG_WRITE_PORT:-5432}
      PG_READ_PORT: ${PG_READ_PORT:-5433}
      PG_DATABASE: ${PG_DATABASE:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?must match a-infra-postgres/.env}

      CITY_MIN_LAT: ${CITY_MIN_LAT:-40.49}
      CITY_MAX_LAT: ${CITY_MAX_LAT:-40.92}
      CITY_MIN_LON: ${CITY_MIN_LON:--74.26}
      CITY_MAX_LON: ${CITY_MAX_LON:--73.70}
      CITY_GRID_ROWS: ${CITY_GRID_ROWS:-6}
      CITY_GRID_COLS: ${CITY_GRID_COLS:-6}

      # Prices. The same three numbers h-bootstrap used for the seeded week,
      # so live trips are priced the way the history was.
      FARE_BASE: ${FARE_BASE:-3.0}
      FARE_PER_KM: ${FARE_PER_KM:-1.75}
      FARE_PER_MINUTE: ${FARE_PER_MINUTE:-0.45}

      DISPATCH_TICK_SECONDS: ${DISPATCH_TICK_SECONDS:-1.0}
      DISPATCH_SEARCH_RADIUS_KM: ${DISPATCH_SEARCH_RADIUS_KM:-5.0}
      DISPATCH_MAX_REQUESTS_PER_TICK: ${DISPATCH_MAX_REQUESTS_PER_TICK:-50}
      CANCEL_BY_DRIVER_CHANCE: ${CANCEL_BY_DRIVER_CHANCE:-0.06}
      CANCEL_BY_PASSENGER_CHANCE: ${CANCEL_BY_PASSENGER_CHANCE:-0.07}
      TRIP_ACTIVE_TTL_SECONDS: ${TRIP_ACTIVE_TTL_SECONDS:-7200}
      RANDOM_SEED: ${RANDOM_SEED:-20250824}
    networks:
      - backbone

networks:
  backbone:
    external: true
    name: nus-backbone
