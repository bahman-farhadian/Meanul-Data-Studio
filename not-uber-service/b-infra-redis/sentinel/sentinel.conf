# nus-cache Sentinel — static settings, identical on sentinel-1/2/3.
#
# TEMPLATE, not the live config: entrypoint.sh copies it to
# /data/sentinel.conf and appends the monitor block. Sentinel rewrites its own
# config file constantly (known replicas, known sentinels, current epoch, the
# monitor line after a failover), so the live file must be writable and must
# persist on a volume — otherwise every restart wipes the Sentinel's memory of
# the cluster it is monitoring.

port 26379
dir /data

# Sentinel is deliberately unauthenticated, and therefore explicitly not
# protected-mode: it publishes no host port and is reachable only inside
# nus-backbone. This mirrors the piece-a decision to leave Patroni's read-only
# monitoring endpoints open — discovery must never be the thing that breaks.
# The DATA nodes are password-protected (see sentinel auth-pass, appended).
bind 0.0.0.0
protected-mode no

# Docker gives containers new IPs on recreate, so the whole Sentinel set works
# in hostnames: resolve them in config, and gossip them to peers and clients.
# Both directives are required — a client that discovers a stale IP would
# connect to whatever container inherited it.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

loglevel notice
logfile ""

# The monitor block (announce-ip, monitor, auth-pass, down-after-milliseconds,
# failover-timeout, parallel-syncs) is appended by entrypoint.sh — Redis
# requires `sentinel monitor` to precede every other directive naming the
# master, and the secret must not live in a committed file.
