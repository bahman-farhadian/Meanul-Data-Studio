# nus-cache data node — static tuning, identical on redis-1/2/3.
#
# This file is a TEMPLATE. entrypoint.sh copies it to /data/redis.conf on
# first start and appends the per-node and secret lines (identity, auth,
# maxmemory, initial replicaof). It is never the live config: Redis rewrites
# the live file (CONFIG REWRITE) whenever Sentinel promotes or demotes the
# node, and a read-only bind mount would make that rewrite fail — the node
# would come back from a restart believing it is still a primary.

# network --------------------------------------------------------------------
# Explicit bind + requirepass; nothing is published to the host, every client
# reaches the node over the nus-backbone network.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# memory ---------------------------------------------------------------------
# maxmemory is appended by entrypoint.sh, deliberately well below the 4 GB
# container limit: a fork for AOF rewrite copies dirty pages, and with
# memswap_limit == mem_limit there is no swap to absorb the spike.
#
# noeviction, NOT an LRU policy: Redis holds live operational state written
# directly by the services (geo:drivers:available, trip:{id}:active), not only
# CDC-replayable copies of PostgreSQL rows. Silently evicting those would
# corrupt dispatch decisions; failing the write instead is loud and diagnosable.
maxmemory-policy noeviction

# persistence ----------------------------------------------------------------
# AOF only. RDB snapshots are disabled so a busy node cannot fork twice for
# two persistence mechanisms; everysec fsync is the usual durability/latency
# trade, and the cache is reconstructible from CDC replay in the worst case.
save ""
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb

# replication ----------------------------------------------------------------
# Diskless sync keeps a full resync off the disk entirely — the dataset is
# small enough to stream, and it avoids a second fork on the primary.
repl-diskless-sync yes
repl-diskless-load on-empty-db
replica-read-only yes

# logging --------------------------------------------------------------------
# Empty logfile = stdout, so `docker compose logs` is the single log surface.
loglevel notice
logfile ""
