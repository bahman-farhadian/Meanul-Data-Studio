# A throwaway stack, entirely separate from not-uber-service's own compose
# project - `make lion-prepare` brings this up on its own, before the real
# stack even exists (it runs as part of `make prepare`), and tears it down
# right after. Nothing here is ever part of a deployed nus-* container.
#
# The password below is not a real credential: this database exists for a
# few minutes, on a private network only this compose project can see, and
# is destroyed with `docker compose down -v` at the end of the same run.

name: nus-lion-prepare

services:
  lion-pg:
    build:
      # Builds install packages, which needs egress from the build container.
      # Defaults to the host's own network: a tunnel between here and this
      # host usually cannot see a build's forwarded container traffic, even
      # while the host's own connections work fine. Set BUILD_NETWORK=default
      # if this host has no such gap.
      network: ${BUILD_NETWORK:-host}
      context: .
      dockerfile: lion-pg.Dockerfile
      args:
        POSTGIS_IMAGE: ${LION_PG_IMAGE:-postgis/postgis:17-3.5}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LION_PG_PASSWORD:-throwaway-local-only}
      POSTGRES_DB: lion
    # Tuned for throughput, not durability - this database is destroyed
    # with the container at the end of this same run (see the note at the
    # top of this file), so fsync/synchronous_commit/full_page_writes buy
    # crash-safety nothing here will ever need. Out of the box Postgres's
    # tiny defaults (128MB shared_buffers, 2 parallel workers) leave a real
    # server's cores and RAM almost entirely idle during the expensive
    # step (filtering, cost computation, pgr_createTopology over ~170,000
    # edges) - confirmed directly, under 10% CPU on a 24-thread host.
    # Every value is overridable in .env for a smaller dev machine.
    #
    # This is the only container running when lion-prepare is on the
    # critical path (make prepare runs it before the real stack exists,
    # and zone-demand-prepare after it, never alongside it - see
    # Makefile's prepare target), so there is nothing else on the host to
    # leave headroom for. Every other service in this project reserves
    # cpus explicitly (docker leaves a container unlimited without it);
    # this one had been the one exception, which is worth closing rather
    # than relying on an implicit default.
    cpus: ${LION_PG_CPUS:-20}
    command:
      - -c
      - shared_buffers=${LION_PG_SHARED_BUFFERS:-2GB}
      - -c
      - work_mem=${LION_PG_WORK_MEM:-256MB}
      - -c
      - maintenance_work_mem=${LION_PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - max_wal_size=${LION_PG_MAX_WAL_SIZE:-8GB}
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_worker_processes=${LION_PG_MAX_WORKER_PROCESSES:-16}
      - -c
      - max_parallel_workers=${LION_PG_MAX_PARALLEL_WORKERS:-12}
      - -c
      - max_parallel_workers_per_gather=${LION_PG_MAX_PARALLEL_WORKERS_PER_GATHER:-6}
      - -c
      - max_parallel_maintenance_workers=${LION_PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-6}
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes:
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lion-prepare

  lion-prepare:
    build:
      # See lion-pg's build.network comment above.
      network: ${BUILD_NETWORK:-host}
      context: ../..
      dockerfile: h-bootstrap/lion-prepare/Dockerfile
    depends_on:
      lion-pg:
        condition: service_healthy
    environment:
      LION_PG_HOST: lion-pg
      LION_PG_PASSWORD: ${LION_PG_PASSWORD:-throwaway-local-only}
    # A psql/ogr2ogr client mostly waiting on lion-pg, not computing itself -
    # a modest reservation, not the large one lion-pg gets above.
    cpus: ${LION_PREPARE_CPUS:-4}
    volumes:
      - ${NUS_LION_DATA_DIR:?set it}:/data
    networks:
      - lion-prepare

networks:
  lion-prepare:
    name: nus-lion-prepare
