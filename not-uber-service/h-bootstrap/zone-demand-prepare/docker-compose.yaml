# A throwaway one-shot, entirely separate from not-uber-service's own
# compose project - `make zone-demand-prepare` brings this up on its own
# (part of `make prepare`) and it exits when done. No database, no
# network of its own to tear down - just one container that reads the
# trip-record parquet `make tlc-trips-fetch` already downloaded to the
# shared volume, and writes two CSV files back to it.
#
# Talks to no other container and reaches nowhere outside this host: the
# one thing here that used to need real internet access (streaming the
# parquet straight from CloudFront) moved to a host-side fetch step
# instead, the same as lion-fetch/tlc-zones-fetch - see tlc-trips-fetch
# in h-bootstrap/Makefile for why (repeated network egress on every
# retry, real cost on a metered host).

name: nus-zone-demand-prepare

services:
  zone-demand-prepare:
    build:
      network: ${BUILD_NETWORK:-host}
      context: ../..
      dockerfile: h-bootstrap/zone-demand-prepare/Dockerfile
    environment:
      TLC_TRIP_DATA_MONTH: ${TLC_TRIP_DATA_MONTH:-2025-01}
      OUTPUT_DIR: /data
    volumes:
      - ${NUS_LION_DATA_DIR:?set it}:/data
