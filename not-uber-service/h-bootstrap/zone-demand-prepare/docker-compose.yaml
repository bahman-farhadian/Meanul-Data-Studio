# A throwaway one-shot, entirely separate from not-uber-service's own
# compose project - `make zone-demand-prepare` brings this up on its own
# (part of `make prepare`) and it exits when done. No database, no
# network of its own to tear down - just one container that writes two
# CSV files to the shared volume and stops.

name: nus-zone-demand-prepare

services:
  zone-demand-prepare:
    build:
      network: ${BUILD_NETWORK:-host}
      context: ../..
      dockerfile: h-bootstrap/zone-demand-prepare/Dockerfile
    # Same gap as build.network above, but at runtime: this is the one
    # container in the whole project that opens its own connection to the
    # public internet (streaming the TLC parquet directly) instead of
    # downloading on the host first, like lion-fetch/tlc-zones-fetch do -
    # confirmed directly, Docker's default bridge network cannot reach it
    # on this host (ConnectionRefusedError on the CloudFront IP), the same
    # tunnel-does-not-forward-container-traffic gap lion-fetch/
    # tlc-zones-fetch were written to route around by running on the host
    # instead. Override to the default bridge network on a host without
    # that gap.
    network_mode: ${ZONE_DEMAND_PREPARE_NETWORK:-host}
    environment:
      TLC_TRIP_DATA_MONTH: ${TLC_TRIP_DATA_MONTH:-2025-01}
      OUTPUT_DIR: /data
    volumes:
      - ${NUS_LION_DATA_DIR:?set it}:/data
