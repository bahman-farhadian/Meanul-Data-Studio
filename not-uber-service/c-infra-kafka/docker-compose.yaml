# c-infra-kafka — the streaming backbone: three Kafka brokers in KRaft mode
# (each node is broker AND controller, so there is no ZooKeeper), the Schema
# Registry that holds the Avro schema of every topic, and ksqlDB — the SQL
# layer a client like DBeaver actually talks to (its Kafka support does not
# speak the raw broker protocol).
#
# Every event on this cluster is binary Avro. A message carries only the id
# of its schema; the reader asks the Schema Registry what that id means. That
# keeps messages small and lets a schema change without breaking old readers.
#
# Kafka is behind lb-a — but not the way Postgres/Redis are. A Kafka client
# asks any broker for cluster metadata, which hands back the exact address
# to dial for every partition after that; the address is baked into each
# broker's own config, not something a proxy can redirect at request time.
# So this is a dedicated TCP passthrough port per (broker, advertised
# address) pair, not a shared write/read pair, and it stays on lb-a only —
# lb-a/lb-b failover doesn't compose with an address fixed at broker
# startup the way it does for a role-aware health check. The 3-broker
# cluster's own bootstrap-list fallback is Kafka's actual redundancy story.
# Verified locally before this shipped: a message produced through one
# broker's proxy port was consumed back through a different broker's.
#
# Standalone test:
#   docker network create nus-backbone     (once, shared by the whole stack)
#   cp .env.example .env
#   docker compose run --rm kafka-dirs     (one-shot, prepares the volumes)
#   docker compose up -d
#   docker compose run --rm kafka-topics-init
#
# In the full stack this file is include'd by the root docker-compose.yaml.
# Full-stack runbook: ../README.md

name: c-infra-kafka

x-kafka-broker: &kafka-broker
  image: ${KAFKA_IMAGE:-apache/kafka:4.0.0}
  restart: unless-stopped
  cpus: 1.2
  mem_limit: 5.5g
  memswap_limit: 5.5g
  healthcheck:
    # Asking the broker for its API versions proves it is not merely running
    # but actually answering on the client port.
    test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 45s
  networks:
    - backbone

x-kafka-env: &kafka-env
  TZ: ${TZ:-UTC}
  # Every broker in one cluster must share this id. It is generated once and
  # then never changed - see .env.example.
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set it in c-infra-kafka/.env}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXT_A:PLAINTEXT,EXT_B:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Safety settings for a three-broker cluster: every topic is written to all
  # three brokers, and a write is only accepted while at least two of them
  # have it. One broker can die without losing data or blocking writers.
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_NUM_PARTITIONS: "3"
  # Topics are created on purpose by kafka-topics-init, never by accident:
  # a typo in a topic name should fail loudly, not silently make a new topic.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-48}
  # A consumer group forms immediately instead of waiting for stragglers.
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  # The JVM heap is capped well below the 5.5 GB container limit. Kafka wants
  # the rest as operating-system page cache, which is what makes reads fast.
  KAFKA_HEAP_OPTS: -Xmx3500m -Xms3500m

services:
  # One-shot: give the Kafka data volumes to the user inside the image.
  #
  # Docker creates a brand-new named volume owned by root. The Kafka image
  # runs as a normal user, so without this step the broker cannot write to
  # its own log directory and exits at once. Run it BEFORE the first `up`.
  # Check the uid the image really uses with:
  #   docker run --rm ${KAFKA_IMAGE} id
  kafka-dirs:
    image: ${BUSYBOX_IMAGE:-busybox:1.37.0}
    profiles: ["init"]
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    command:
      - sh
      - -c
      - chown -R ${KAFKA_UID:-1000}:${KAFKA_GID:-1000} /data-1 /data-2 /data-3 && echo "kafka data dirs ready"
    volumes:
      - kafka-data-1:/data-1
      - kafka-data-2:/data-2
      - kafka-data-3:/data-3
    networks:
      - backbone

  kafka-1:
    <<: *kafka-broker
    container_name: kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXT_A://0.0.0.0:9094,EXT_B://0.0.0.0:9095
      # INTERNAL: what other containers are told to connect to — the name
      # they resolve on nus-backbone, not localhost. EXT_A/EXT_B: what an
      # external client is told, one port per address this broker answers
      # on through lb-a (see the header comment for why there are two).
      # The port numbers are not a separate .env knob: HAProxy cannot read
      # ${VAR} from its own environment (confirmed, not assumed — the same
      # finding that shaped how Redis's password reaches it), so these have
      # to match haproxy.cfg's literal bind ports exactly. A variable here
      # that silently drifts from a hardcoded number there is worse than
      # both being plainly fixed.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXT_A://${KAFKA_ADVERTISED_HOST_A:?set it in .env}:9094,EXT_B://${KAFKA_ADVERTISED_HOST_B:?set it in .env}:9097
    volumes:
      - kafka-data-1:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-broker
    container_name: kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXT_A://0.0.0.0:9094,EXT_B://0.0.0.0:9095
      # See kafka-1 for what EXT_A/EXT_B are and why the ports are fixed.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXT_A://${KAFKA_ADVERTISED_HOST_A:?set it in .env}:9095,EXT_B://${KAFKA_ADVERTISED_HOST_B:?set it in .env}:9098
    volumes:
      - kafka-data-2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-broker
    container_name: kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXT_A://0.0.0.0:9094,EXT_B://0.0.0.0:9095
      # See kafka-1 for what EXT_A/EXT_B are and why the ports are fixed.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXT_A://${KAFKA_ADVERTISED_HOST_A:?set it in .env}:9096,EXT_B://${KAFKA_ADVERTISED_HOST_B:?set it in .env}:9099
    volumes:
      - kafka-data-3:/var/lib/kafka/data

  # The Schema Registry keeps every topic's Avro schema and hands out the ids
  # that travel inside each message. It stores them in a Kafka topic, so it
  # holds no state of its own and can be restarted freely.
  schema-registry:
    image: ${SCHEMA_REGISTRY_IMAGE:-confluentinc/cp-schema-registry:8.0.0}
    container_name: schema-registry
    hostname: schema-registry
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
      # BACKWARD: a new schema must still be readable by consumers written
      # against the previous one. Adding an optional field is fine; removing
      # a required field is refused at registration time.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      # python3, not curl. This image is built on cp-base-java-micro, which
      # ships neither curl nor wget nor nc — so a curl healthcheck can never
      # pass, the container is marked unhealthy however well it is running,
      # and everything that waits on it refuses to start. python3 is present.
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8081/subjects", timeout=3)
      interval: 15s
      timeout: 10s
      retries: 6
      # The registry runs its own preflight against every broker before it
      # listens, so give it room on a cold start.
      start_period: 60s
    networks:
      - backbone

  # One-shot: write ksqlDB's HTTP Basic-auth credentials (a JAAS config plus
  # the property file it points at). Neither file format substitutes ${VAR}
  # on its own - same reason haproxy-config-render exists for Redis's
  # password - so this writes them from KSQLDB_ADMIN_USER/_PASSWORD in .env.
  # Run it BEFORE ksqldb-server's first start.
  ksqldb-secrets-init:
    image: ${BUSYBOX_IMAGE:-busybox:1.38.0}
    profiles: ["init"]
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      TZ: ${TZ:-UTC}
      KSQLDB_ADMIN_USER: ${KSQLDB_ADMIN_USER:-admin}
      KSQLDB_ADMIN_PASSWORD: ${KSQLDB_ADMIN_PASSWORD:?set it in .env}
    command:
      - sh
      - -c
      - |
        set -eu
        printf 'KsqlServerAuth {\n  org.eclipse.jetty.security.jaas.spi.PropertyFileLoginModule required\n  file="/etc/ksqldb-secrets/password.properties"\n  debug="false";\n};\n' > /secrets/jaas_config.file
        printf '%s: %s,ksql-user\n' "$$KSQLDB_ADMIN_USER" "$$KSQLDB_ADMIN_PASSWORD" > /secrets/password.properties
        chmod 0444 /secrets/jaas_config.file /secrets/password.properties
        echo "ksqlDB Basic-auth credentials written for user $$KSQLDB_ADMIN_USER"
    volumes:
      - ksqldb-secrets:/secrets
    networks:
      - backbone

  # The SQL layer over the cluster. DBeaver's own Kafka support only speaks
  # ksqlDB's REST API, not the raw broker protocol used by kafka-1/2/3 above
  # — this is what makes a topic queryable from a SQL client at all.
  # Verified locally before this shipped: CREATE STREAM over a real topic,
  # then SELECT ... EMIT CHANGES returned a real row back.
  #
  # HTTP Basic auth is on: Kafka itself has none, and DBeaver's ksqlDB driver
  # requires a login regardless, so this is the one place in the cluster that
  # actually gates access. The package for the JAAS login module moved in
  # Jetty 12 from org.eclipse.jetty.jaas.spi to org.eclipse.jetty.security.jaas.spi
  # - Confluent's own docs still show the old one; confirmed by testing
  # against this exact pinned image, not assumed.
  ksqldb-server:
    image: ${KSQLDB_IMAGE:-confluentinc/cp-ksqldb-server:8.3.1}
    container_name: ksqldb-server
    hostname: ksqldb-server
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1.5g
    memswap_limit: 1.5g
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      KSQL_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: nus_ksqldb_
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Same safety story as the rest of this cluster (see the "Safety
      # settings" table in README.md): ksqlDB's own command topic and any
      # persistent query's internal topics survive one broker dying, not
      # just the topics it reads and writes.
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: "3"
      KSQL_KSQL_INTERNAL_TOPIC_MIN_INSYNC_REPLICAS: "2"
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: "3"
      KSQL_KSQL_STREAMS_TOPIC_MIN_INSYNC_REPLICAS: "2"
      KSQL_HEAP_OPTS: -Xmx1g -Xms1g
      KSQL_OPTS: -Djava.security.auth.login.config=/etc/ksqldb-secrets/jaas_config.file
      KSQL_AUTHENTICATION_METHOD: BASIC
      KSQL_AUTHENTICATION_REALM: KsqlServerAuth
      KSQL_AUTHENTICATION_ROLES: ksql-user
      # Only so the healthcheck below can log in as the same user; never sent
      # anywhere outside this container.
      KSQLDB_ADMIN_USER: ${KSQLDB_ADMIN_USER:-admin}
      KSQLDB_ADMIN_PASSWORD: ${KSQLDB_ADMIN_PASSWORD:?set it in .env}
    volumes:
      - ksqldb-secrets:/etc/ksqldb-secrets:ro
    healthcheck:
      # python3, not curl - same finding as schema-registry: this image has
      # neither curl nor wget nor nc, so a curl healthcheck never passes.
      # Sends the same Basic auth header a real client must send now.
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,base64,os; req=urllib.request.Request('http://localhost:8088/info'); req.add_header('Authorization','Basic '+base64.b64encode(('%s:%s'%(os.environ['KSQLDB_ADMIN_USER'],os.environ['KSQLDB_ADMIN_PASSWORD'])).encode()).decode()); urllib.request.urlopen(req, timeout=3)"
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    networks:
      - backbone

  # One-shot: create every topic from topics/topics.tsv. Run it AFTER `up`,
  # once the brokers are healthy. Re-runs are safe - existing topics are
  # skipped, so this is also how a newly added topic is rolled out.
  kafka-topics-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.0}
    profiles: ["init"]
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    environment:
      TZ: ${TZ:-UTC}
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-48}
    volumes:
      - ./topics/create-topics.sh:/create-topics.sh:ro
      - ./topics/topics.tsv:/topics.tsv:ro
    networks:
      - backbone

volumes:
  kafka-data-1:
    name: nus-kafka-data-1
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-kafka-data-1
  kafka-data-2:
    name: nus-kafka-data-2
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-kafka-data-2
  kafka-data-3:
    name: nus-kafka-data-3
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-kafka-data-3
  ksqldb-secrets:
    name: nus-ksqldb-secrets
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NUS_VOLUME_ROOT:?set it in not-uber-service/.env}/nus-ksqldb-secrets

networks:
  backbone:
    external: true
    name: nus-backbone
