slice_name: 'Driver utilization'
description: 'Share of online time spent on a trip, fleet-wide. READ THE SEEDED WINDOW WITH CARE: h-bootstrap writes driver positions only along trip paths and only as on_trip, so the history has no idle telemetry and this reads 100% across it, then drops to the real figure when live traffic starts. The cliff is the seam between seeded and live, not a collapse in efficiency.'
