# Throwaway single-node stores for on-laptop routing/data-quality checks.
# Project name is unique so `down -v` cannot touch idops or a real nus stack.
# No LION/tiles volumes. Passwords come from the environment (see the test).

name: nus-goal-sample

services:
  pg:
    image: nus-lion-prepare-lion-pg:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nus
      POSTGRES_PASSWORD: ${NUS_SAMPLE_PG_PASSWORD:?}
    ports:
      - "15432:5432"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nus"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  redis:
    image: redis:8.10.1
    environment:
      REDIS_PASSWORD: ${NUS_SAMPLE_REDIS_PASSWORD:?}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --bind 0.0.0.0 --save "" --appendonly no
    ports:
      - "16379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "19092:9092"
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 25s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "18081:8081"
    mem_limit: 768m
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/subjects')"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    environment:
      CLICKHOUSE_DB: nus
      CLICKHOUSE_USER: nus
      CLICKHOUSE_PASSWORD: ${NUS_SAMPLE_CH_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "18123:8123"
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user nus --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
